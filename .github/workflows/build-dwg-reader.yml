# Builds the backup DWG reader (/dwg-next) that the site tries when its usual reader cannot
# open a file. It is mlightcad/libredwg-web (LibreDWG compiled to WebAssembly) with newer
# LibreDWG merged in. Run it by hand: Actions → "Build backup DWG reader" → Run workflow.
# It commits the result to dwg-next/ on main, and Vercel deploys it like any other change.
name: Build backup DWG reader

on:
  workflow_dispatch:
    inputs:
      web_commit:
        description: "mlightcad/libredwg-web commit (the web bindings)"
        default: "1e8972121130198dee363478b47f89b944842276"   # v0.8.4
      upstream_commit:
        description: "LibreDWG/libredwg commit to merge in"
        default: "c184dd0d3f612de98feb36a5e74eb28c8078e349"   # 2026-11-06
      emsdk_version:
        description: "Emscripten version (the web bindings are written for 4.0.x)"
        default: "4.0.10"

permissions:
  contents: write

# The LibreDWG checkout is built outside this repository: the site's package.json says
# "type": "module", and Node would then read configure's compiled test programs as ES modules
# and fail them ("cannot run C compiled programs").
env:
  LW: ${{ github.workspace }}/../lw

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool texinfo perl python3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.emsdk_version }}
          actions-cache-folder: emsdk-cache

      - name: Check the compiler
        run: |
          emcc --version
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          emcc -O2 -sUSE_ZLIB=1 /tmp/t.c -o /tmp/t.js && echo "emcc works"

      - name: Web bindings with newer LibreDWG merged in
        run: |
          git clone https://github.com/mlightcad/libredwg-web.git "$LW"
          cd "$LW"
          git checkout "${{ inputs.web_commit }}"
          git submodule update --init --depth 1 jsmn
          git remote add upstream https://github.com/LibreDWG/libredwg.git
          git fetch upstream "${{ inputs.upstream_commit }}"
          git -c user.email=ci@localhost -c user.name=ci merge --no-edit FETCH_HEAD || true
          python3 "$GITHUB_WORKSPACE/tools/dwg/merge-upstream.py"

      - name: Build the WebAssembly reader
        run: |
          cd "$LW"
          # Everything goes to build.log too; on failure its last lines (and configure's log) are
          # posted as an annotation, which shows on the run's summary page without opening logs.
          report() {
            { echo "== last lines of the build =="; tail -n 40 "$GITHUB_WORKSPACE/build.log";
              if [ -f build-wasm/config.log ]; then echo "== config.log =="; grep -n -B2 -A12 "error" build-wasm/config.log | tail -n 40; fi; } > /tmp/why.txt
            msg=$(sed -e 's/%/%25/g' /tmp/why.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
          }
          trap 'rc=$?; [ $rc -ne 0 ] && report; exit $rc' EXIT
          set -o pipefail
          {
            set -ex
            sh ./autogen.sh
            cd bindings/javascript
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
            pnpm build:prepare
            pnpm build:obj
            pnpm build:wasm
            pnpm copy
            pnpm build
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Copy into the site (memory capped)
        env:
          DWG_READER_NOTE: "libredwg-web@${{ inputs.web_commit }} + LibreDWG@${{ inputs.upstream_commit }}"
        run: |
          node tools/dwg/build.cjs "$LW/bindings/javascript" dwg-next --with-wasm
          ls -la dwg-next dwg-next/*

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dwg-next
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Backup DWG reader: libredwg-web ${{ inputs.web_commit }} + LibreDWG ${{ inputs.upstream_commit }}"
          git push
