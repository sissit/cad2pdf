<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>后台 · cad2pdf</title>
<style>
:root { --bg:#eef1f4; --panel:#fff; --ink:#18202b; --muted:#5b6776; --rule:#cdd5de; --accent:#1d5bb8; --ok:#1f7a4a; --err:#b42318; }
@media (prefers-color-scheme: dark) { :root { --bg:#12171e; --panel:#1a212b; --ink:#e4e9ef; --muted:#98a4b3; --rule:#2d3743; --accent:#6b9ff0; --ok:#5fc48e; --err:#f2876f; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 1.4rem; margin: 0 0 16px; }
.card { background:var(--panel); border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.card.done { opacity:.6; }
.meta { color:var(--muted); font-size:.85rem; display:flex; flex-wrap:wrap; gap:4px 14px; }
.msg { white-space:pre-wrap; word-break:break-word; margin:8px 0; }
.set { font-size:.8rem; color:var(--muted); background:color-mix(in srgb, var(--rule) 30%, transparent); border-radius:6px; padding:6px 8px; word-break:break-word; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
input[type=password] { font:inherit; padding:9px 10px; border:1px solid var(--rule); border-radius:8px; background:var(--panel); color:var(--ink); width:200px; }
button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--rule); background:var(--panel); color:var(--ink); cursor:pointer; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.danger { color:var(--err); }
.status { margin:10px 0; color:var(--muted); }
.status.err { color:var(--err); }
.tabs button[aria-pressed=true] { background:var(--accent); color:#fff; border-color:var(--accent); }
.actions { margin-top:8px; }
.maintabs { border-bottom:1px solid var(--rule); margin-bottom:14px; gap:4px; }
.maintabs [role=tab] { border:0; border-bottom:3px solid transparent; border-radius:0; background:none; font-weight:600; padding:10px 14px; color:var(--muted); }
.maintabs [role=tab][aria-selected=true] { color:var(--accent); border-bottom-color:var(--accent); }
.badge { display:inline-block; min-width:18px; margin-left:6px; padding:0 6px; border-radius:9px; background:var(--accent); color:#fff; font-size:.75rem; line-height:18px; text-align:center; }
.badge:empty { display:none; }
.sub { font-size:1.05rem; margin:4px 0 10px; }
.muted { color:var(--muted); }
.kpis { display:flex; flex-wrap:wrap; gap:10px 28px; margin-bottom:12px; }
.kpi b { display:block; font-size:1.5rem; line-height:1.2; }
.kpi span { color:var(--muted); font-size:.85rem; }
.bars { display:flex; align-items:flex-end; gap:3px; height:110px; margin:6px 0 2px; }
.bars div { flex:1; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; position:relative; }
.bars div:hover::after { content:attr(data-t); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--panel); font-size:.75rem; padding:2px 6px; border-radius:4px; white-space:nowrap; margin-bottom:4px; }
.axis { display:flex; justify-content:space-between; color:var(--muted); font-size:.75rem; }
.cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:14px; }
.cols table { width:100%; border-collapse:collapse; font-size:.88rem; }
.cols th { text-align:left; color:var(--muted); font-weight:500; padding:2px 0; }
.cols td { padding:3px 0; border-top:1px solid var(--rule); }
.cols td:last-child, .cols th:last-child { text-align:right; }
.home { display:inline-block; text-decoration:none; font-weight:500; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); color:var(--accent); background:var(--panel); }
.home:hover { background:var(--accent); color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between;margin-bottom:16px">
    <h1 style="margin:0">后台</h1>
    <a href="/" class="home" role="button">← 回到首页</a>
  </div>
  <form id="login" class="card row">
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password" required>
    <button class="primary" type="submit">进入</button>
  </form>
  <div id="panel" hidden>
    <div class="row maintabs" role="tablist">
      <button type="button" role="tab" data-tab="fb" aria-selected="true">意见<span class="badge" id="fb-count"></span></button>
      <button type="button" role="tab" data-tab="tr" aria-selected="false">流量</button>
      <span style="flex:1"></span>
      <button type="button" id="refresh">刷新</button>
      <button type="button" id="logout">退出</button>
    </div>
    <div id="tab-fb" role="tabpanel">
      <div class="row tabs" style="margin-bottom:12px">
        <button type="button" data-f="open" aria-pressed="true">未处理</button>
        <button type="button" data-f="all" aria-pressed="false">全部</button>
      </div>
      <div id="list"></div>
    </div>
    <div id="tab-tr" role="tabpanel" hidden>
      <section class="card" id="traffic"><div id="tr-body" class="muted">读取中…</div></section>
    </div>
  </div>
  <p class="status" id="status" role="status"></p>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let pw = ""; try { pw = sessionStorage.getItem("cad2pdf-admin") || ""; } catch (e) {}
  let items = [], filter = "open";
  const say = (t, err) => { $("status").textContent = t; $("status").className = "status" + (err ? " err" : ""); };
  async function call(action, id) {
    const r = await fetch("/api/admin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: pw, action, id }) });
    const j = await r.json().catch(() => ({}));
    const span = (m) => m >= 1440 ? "24 小时" : m >= 60 ? "1 小时" : m + " 分钟";
    if (r.status === 401) throw new Error(j.left > 0 ? `密码不对，再错 ${j.left} 次将锁定 ${span(j.lockMinutes || 15)}。` : `密码不对，已锁定 ${span(j.lockMinutes || 15)}。`);
    if (r.status === 429) throw new Error(`输错次数太多，已锁定 ${span(j.minutes || 15)}，请稍后再试。`);
    if (!r.ok) throw new Error("出错了，请稍后再试。");
    return j;
  }
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function show() {
    if (tab !== "fb") { $("fb-count").textContent = items.filter(x => !x.done).length || ""; return; }
    const shown = items.filter(x => filter === "all" || !x.done);
    const open = items.filter(x => !x.done).length;
    say(`共 ${items.length} 条，未处理 ${open} 条。`);
    $("fb-count").textContent = open ? String(open) : "";
    $("list").innerHTML = shown.length ? shown.map(x => `
      <div class="card${x.done ? " done" : ""}">
        <div class="meta"><span>${esc(new Date(x.at).toLocaleString("zh-CN", { hour12: false }))}</span>${x.contact ? `<span>联系方式：${esc(x.contact)}</span>` : ""}${x.lang ? `<span>页面语言：${esc(x.lang)}</span>` : ""}</div>
        <div class="msg">${esc(x.message)}</div>
        ${x.settings ? `<div class="set">${Object.entries(x.settings).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(" · ")}</div>` : ""}
        ${x.ua ? `<div class="set" style="margin-top:4px">${esc(x.ua)}</div>` : ""}
        <div class="row actions">
          <button type="button" data-act="${x.done ? "undone" : "done"}" data-id="${esc(x.id)}">${x.done ? "改回未处理" : "标为已处理"}</button>
          <button type="button" class="danger" data-act="delete" data-id="${esc(x.id)}">删除</button>
        </div>
      </div>`).join("") : `<div class="card">${filter === "open" ? "没有未处理的意见。" : "还没有意见。"}</div>`;
  }
  // ---------- traffic ----------
  const region = (() => { try { return new Intl.DisplayNames(["zh-CN"], { type: "region" }); } catch (e) { return null; } })();
  const devName = { desktop: "电脑", mobile: "手机", tablet: "平板" };
  function table(title, rows, label) {
    if (!rows || !rows.length) return "";
    return `<div><table><tr><th>${title}</th><th>访客</th></tr>${rows.map(r => `<tr><td>${esc(label(r))}</td><td>${r.visitors}</td></tr>`).join("")}</table></div>`;
  }
  async function loadTraffic() {
    const el = $("tr-body");
    try {
      const d = await call("stats");
      if (!d.configured) { el.innerHTML = "还没接上流量数据：需要在 Vercel 里加 VERCEL_ANALYTICS_TOKEN。"; return; }
      if (d.error) { el.textContent = "流量数据暂时读不到（" + d.error + "）。"; return; }
      const days = d.daily || [], max = Math.max(1, ...days.map(x => x.visitors));
      const md = (t) => { const x = new Date(t); return (x.getUTCMonth() + 1) + "/" + x.getUTCDate(); };
      const today = days.length ? days[days.length - 1] : { visitors: 0, pageviews: 0 };
      el.className = "";
      el.innerHTML = `
        <div class="kpis">
          <div class="kpi"><b>${d.total.visitors}</b><span>累计访客</span></div>
          <div class="kpi"><b>${d.total.pageviews}</b><span>累计浏览</span></div>
          <div class="kpi"><b>${d.month.visitors}</b><span>近 30 天访客</span></div>
          <div class="kpi"><b>${today.visitors}</b><span>今天访客（UTC）</span></div>
        </div>
        <div class="muted" style="font-size:.85rem">近 30 天每日访客</div>
        <div class="bars">${days.map(x => `<div style="height:${Math.round(x.visitors / max * 100)}%" data-t="${md(x.timestamp)}：${x.visitors} 人 / ${x.pageviews} 次"></div>`).join("")}</div>
        <div class="axis"><span>${days.length ? md(days[0].timestamp) : ""}</span><span>${days.length ? md(days[days.length - 1].timestamp) : ""}</span></div>
        <div class="cols">
          ${table("国家/地区", d.country, r => r.country === "Others" ? "其他" : (region && r.country ? region.of(r.country) : r.country) || "未知")}
          ${table("来源", d.referrer, r => r.referrerHostname === "Others" ? "其他" : r.referrerHostname || "直接访问")}
          ${table("设备", d.device, r => r.deviceType === "Others" ? "其他" : devName[r.deviceType] || r.deviceType || "未知")}
        </div>`;
    } catch (e) { el.textContent = e.message; }
  }
  async function load() {
    say("读取中…");
    try { items = (await call("list")).items || []; $("login").hidden = true; $("panel").hidden = false; show(); }
    catch (e) { say(e.message, true); $("login").hidden = false; $("panel").hidden = true; }
  }
  $("login").addEventListener("submit", (e) => {
    e.preventDefault(); pw = $("pw").value;
    try { sessionStorage.setItem("cad2pdf-admin", pw); } catch (er) {}
    load();
  });
  $("logout").addEventListener("click", () => { pw = ""; try { sessionStorage.removeItem("cad2pdf-admin"); } catch (e) {} items = []; $("list").innerHTML = ""; $("panel").hidden = true; $("login").hidden = false; say(""); });
  let tab = "fb", trLoaded = false;
  function setTab(t) {
    tab = t;
    document.querySelectorAll(".maintabs [role=tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    $("tab-fb").hidden = t !== "fb"; $("tab-tr").hidden = t !== "tr";
    if (t === "tr") { say(""); if (!trLoaded) { trLoaded = true; loadTraffic(); } }
    else show();
  }
  document.querySelectorAll(".maintabs [role=tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  $("refresh").addEventListener("click", () => { if (tab === "tr") loadTraffic(); else load(); });
  document.querySelectorAll(".tabs [data-f]").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f; document.querySelectorAll(".tabs [data-f]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); show();
  }));
  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    if (b.dataset.act === "delete" && !confirm("确定删除这条意见？删除后不能恢复。")) return;
    b.disabled = true;
    try { await call(b.dataset.act, b.dataset.id); await load(); } catch (er) { say(er.message, true); b.disabled = false; }
  });
  if (pw) load();
})();
</script>
</body>
</html>
