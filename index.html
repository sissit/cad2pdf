<style>
/* Layout: drafting-table split — controls rail on the left, the sheet itself on the right; stacks on phones. */
:root {
  --bg: #eef1f4;          /* drafting film */
  --panel: #f8fafb;
  --ink: #18202b;
  --muted: #5b6776;
  --rule: #cdd5de;
  --accent: #1d5bb8;      /* plan blue */
  --accent-ink: #ffffff;
  --sheet: #ffffff;
  --warn: #9a5a00;
  --ok: #1f7a4a;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "PingFang SC", "Microsoft YaHei", sans-serif;
  --body: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171e; --panel: #1a212b; --ink: #e4e9ef; --muted: #98a4b3; --rule: #2d3743;
    --accent: #6b9ff0; --accent-ink: #0d1520; --sheet: #ffffff; --warn: #e0a54a; --ok: #5fc48e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171e; --panel: #1a212b; --ink: #e4e9ef; --muted: #98a4b3; --rule: #2d3743;
  --accent: #6b9ff0; --accent-ink: #0d1520; --sheet: #ffffff; --warn: #e0a54a; --ok: #5fc48e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.7rem; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.tag { font-family: var(--mono); font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
.hd-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang { display: flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.lang button { font: inherit; font-size: .82rem; background: transparent; color: var(--ink); border: 0; padding: 4px 10px; cursor: pointer; }
.lang button + button { border-left: 1px solid var(--rule); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }
.rail { display: grid; gap: 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; }
.drop {
  display: grid; gap: 4px; place-items: center; text-align: center; padding: 20px 12px;
  border: 1.5px dashed var(--rule); border-radius: 6px; cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.drop strong { font-family: var(--display); font-size: 1.05rem; font-weight: 600; }
.drop span { color: var(--muted); font-size: .85rem; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.field { display: grid; gap: 6px; }
.label { font-family: var(--display); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 7px 8px; width: 100%; }
select:focus-visible, button:focus-visible, .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span { display: block; text-align: center; padding: 6px 4px; cursor: pointer; font-size: .9rem; border-left: 1px solid var(--rule); }
.seg label:first-child span { border-left: 0; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }
button.go {
  font: inherit; font-family: var(--display); font-weight: 600; font-size: 1.05rem; letter-spacing: .02em;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 11px 14px; cursor: pointer;
}
button.go:disabled { opacity: .5; cursor: progress; }
.status { font-size: .85rem; min-height: 1.3em; margin: 0; }
.status.err { color: var(--warn); }
.status.ok { color: var(--ok); }
.stage { display: grid; gap: 10px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-family: var(--mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; }
.sheetbox { background: color-mix(in srgb, var(--ink) 6%, var(--bg)); border-radius: 6px; padding: 18px; display: grid; place-items: center; min-height: 260px; }
.sheet { width: 100%; max-width: 100%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.10); position: relative; }
.sheet svg { display: block; width: 100%; height: auto; }
.badge { position: absolute; top: 8px; left: 8px; font-family: var(--mono); font-size: .72rem; background: #18202b; color: #fff; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--rule); }
.busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.75); font-family: var(--display); color: #18202b; font-size: 1rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<div class="wrap">
  <header>
    <h1 data-i18n="h1"></h1>
    <div class="hd-right"><span class="tag" data-i18n="tag"></span><div class="lang" role="group" aria-label="Language"><button type="button" id="l-zh" data-lang="zh">中</button><button type="button" id="l-en" data-lang="en">EN</button></div></div>
  </header>

  <div class="main">
    <aside class="rail">
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".dwg,.dxf">
        <strong data-i18n="pick"></strong>
        <span data-i18n="support"></span>
      </label>

      <div class="field">
        <span class="label" id="lbl-size" data-i18n="paper"></span>
        <select id="size" aria-labelledby="lbl-size">
          <option value="24x36" selected>24 × 36 in (ARCH D)</option>
          <option value="36x48">36 × 48 in (ARCH E)</option>
          <option value="18x24">18 × 24 in (ARCH C)</option>
          <option value="11x17">11 × 17 in (Tabloid)</option>
          <option value="8.5x11">8.5 × 11 in (Letter)</option>
          <option value="594x841mm">A1  594 × 841 mm</option>
          <option value="297x420mm">A3  297 × 420 mm</option>
        </select>
      </div>

      <div class="field">
        <span class="label" data-i18n="orient"></span>
        <div class="seg" role="radiogroup" data-i18n-aria="orient">
          <label><input type="radio" name="orient" id="o-auto" value="auto" checked><span data-i18n="auto"></span></label>
          <label><input type="radio" name="orient" id="o-land" value="land"><span data-i18n="land"></span></label>
          <label><input type="radio" name="orient" id="o-port" value="port"><span data-i18n="port"></span></label>
        </div>
      </div>

      <div class="field">
        <span class="label" data-i18n="color"></span>
        <div class="seg" role="radiogroup" data-i18n-aria="color">
          <label><input type="radio" name="color" id="c-color" value="color" checked><span data-i18n="cColor"></span></label>
          <label><input type="radio" name="color" id="c-mono" value="mono"><span data-i18n="cMono"></span></label>
        </div>
        <label class="check"><input type="checkbox" id="darken" checked> <span data-i18n="darken"></span></label>
      </div>

      <div class="field">
        <span class="label" id="lbl-lw" data-i18n="lw"></span>
        <select id="lw" aria-labelledby="lbl-lw">
          <option value="0.13" data-i18n="lw13"></option>
          <option value="0.25" selected data-i18n="lw25"></option>
          <option value="0.35" data-i18n="lw35"></option>
          <option value="0.5" data-i18n="lw50"></option>
        </select>
      </div>

      <div class="field">
        <span class="label" id="lbl-mode" data-i18n="mode"></span>
        <select id="mode" aria-labelledby="lbl-mode">
          <option value="auto" selected data-i18n="mAuto"></option>
          <option value="vector" data-i18n="mVec"></option>
          <option value="raster" data-i18n="mRas"></option>
        </select>
      </div>

      <button class="go" id="go" type="button" data-i18n="go"></button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="hint" data-i18n="hint"></p>
    </aside>

    <section class="stage">
      <div class="meta" id="meta"></div>
      <div class="sheetbox">
        <div class="sheet" id="sheet"></div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
  </div>
</div>

    if (r > 235 && g > 235 && b > 235) return "#000000";          // ACI 7 / white → black ink
    const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    if (opts.darken && lum > 0.6) { const k = 0.6 / lum; r *= k; g *= k; b *= k; }
    return "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
  }

  // ---------- DXF → SVG (y-up drawing coordinates) ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function cleanMText(t) {
    return String(t || "")
      .replace(/\\U\+([0-9A-Fa-f]{4})/g, (m, h) => String.fromCharCode(parseInt(h, 16)))
      .replace(/\\P/g, "\n").replace(/\\[ACcfFHhQTWw][^;]*;/g, "").replace(/\\[LlOoKk]/g, "")
      .replace(/\\S([^;]*)\^([^;]*);/g, "$1/$2").replace(/[{}]/g, "").replace(/%%[cC]/g, "Ø")
      .replace(/%%[dD]/g, "°").replace(/%%[pP]/g, "±").replace(/\\~/g, " ");
  }
  function bulgeArc(p1, p2, bulge) {
    const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (!d) return "";
    const r = Math.abs(d * (1 + bulge * bulge) / (4 * bulge));
    const large = Math.abs(bulge) > 1 ? 1 : 0;
    const sweep = bulge > 0 ? 1 : 0;
    return `A${r} ${r} 0 ${large} ${sweep} ${p2.x} ${p2.y}`;
  }
  function polyPath(vs, closed) {
    if (!vs || !vs.length) return "";
    let d = `M${vs[0].x} ${vs[0].y}`;
    const n = closed ? vs.length : vs.length - 1;
    for (let i = 0; i < n; i++) {
      const a = vs[i], b = vs[(i + 1) % vs.length];
      d += a.bulge ? bulgeArc(a, b, a.bulge) : `L${b.x} ${b.y}`;
    }
    return d + (closed ? "Z" : "");
  }
  function arcPath(c, r, a0, a1) { // radians, CCW
    while (a1 <= a0) a1 += Math.PI * 2;
    const x0 = c.x + r * Math.cos(a0), y0 = c.y + r * Math.sin(a0);
    const x1 = c.x + r * Math.cos(a1), y1 = c.y + r * Math.sin(a1);
    return `M${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`;
  }
  function bspline(t, deg, pts, knots) {
    const n = pts.length - 1;
    if (!knots || knots.length !== n + deg + 2) {
      knots = []; for (let i = 0; i <= n + deg + 1; i++) knots.push(i <= deg ? 0 : i > n ? n - deg + 1 : i - deg);
    }
    const lo = knots[deg], hi = knots[n + 1];
    t = lo + t * (hi - lo);
    let s = deg; while (s < n && t >= knots[s + 1]) s++;
    const v = pts.map(p => [p.x, p.y]);
    for (let l = 1; l <= deg; l++) for (let i = s; i > s - deg - 1 + l; i--) {
      const den = knots[i + deg + 1 - l] - knots[i];
      const a = den ? (t - knots[i]) / den : 0;
      v[i] = [(1 - a) * v[i - 1][0] + a * v[i][0], (1 - a) * v[i - 1][1] + a * v[i][1]];
    }
    return v[s];
  }
  function dxfToSvg(text) {
    const P = window.DxfParser && (window.DxfParser.default || window.DxfParser);
    if (!P) fail("noDxfLib");
    const dxf = new P().parseSync(text);
    const layerTbl = (dxf.tables && dxf.tables.layer && dxf.tables.layer.layers) || {};
    const used = new Map();
    let count = 0, cjk = false;
    const layerColor = (name) => { const L = layerTbl[name]; return L && L.color != null ? L.color : 0xFFFFFF; };
    const colorOf = (e, inherit) => {
      if (e.colorIndex === 0 && inherit != null) return inherit;         // BYBLOCK
      if (e.color != null && e.colorIndex !== 256) return e.color;
      return layerColor(e.layer);
    };
    function ent(e, inherit, depth) {
      if (depth > 8) return "";
      const L = layerTbl[e.layer];
      if (L && (L.visible === false || L.frozen)) return "";
      const col = colorOf(e, inherit);
      const c = hex(col);
      used.set(e.layer || "0", hex(layerColor(e.layer)));
      count++;
      const st = `stroke="${c}" fill="none"`;
      switch (e.type) {
        case "LINE": { const [a, b] = e.vertices; return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${st}/>`; }
        case "LWPOLYLINE": case "POLYLINE": {
          const vs = (e.vertices || []).filter(v => !v.faces);
          return `<path d="${polyPath(vs, e.shape || e.closed)}" ${st}/>`;
        }
        case "CIRCLE": return `<circle cx="${e.center.x}" cy="${e.center.y}" r="${e.radius}" ${st}/>`;
        case "ARC": return `<path d="${arcPath(e.center, e.radius, e.startAngle, e.endAngle)}" ${st}/>`;
        case "ELLIPSE": {
          const mx = e.majorAxisEndPoint.x, my = e.majorAxisEndPoint.y;
          const a = Math.hypot(mx, my), b = a * e.axisRatio, rot = Math.atan2(my, mx);
          let t0 = e.startAngle || 0, t1 = e.endAngle == null ? Math.PI * 2 : e.endAngle;
          if (t1 <= t0) t1 += Math.PI * 2;
          const N = 72, pts = [];
          for (let i = 0; i <= N; i++) {
            const t = t0 + (t1 - t0) * i / N, x = a * Math.cos(t), y = b * Math.sin(t);
            pts.push(`${e.center.x + x * Math.cos(rot) - y * Math.sin(rot)} ${e.center.y + x * Math.sin(rot) + y * Math.cos(rot)}`);
          }
          return `<path d="M${pts.join("L")}" ${st}/>`;
        }
        case "SPLINE": {
          const cp = e.controlPoints || e.fitPoints || [];
          if (cp.length < 2) return "";
          if (!e.controlPoints) return `<path d="M${cp.map(p => `${p.x} ${p.y}`).join("L")}" ${st}/>`;
          const deg = Math.min(e.degreeOfSplineCurve || 3, cp.length - 1), pts = [];
          for (let i = 0; i <= 80; i++) { const p = bspline(i / 80, deg, cp, e.knotValues); pts.push(`${p[0]} ${p[1]}`); }
          return `<path d="M${pts.join("L")}" ${st}/>`;
        }
        case "SOLID": case "TRACE": {
          const p = e.points || []; if (p.length < 3) return "";
          const o = p.length === 4 ? [p[0], p[1], p[3], p[2]] : p;
          return `<path d="M${o.map(q => `${q.x} ${q.y}`).join("L")}Z" stroke="${c}" fill="${c}"/>`;
        }
        case "POINT": return "";
        case "TEXT": case "MTEXT": case "ATTRIB": {
          const raw = e.type === "MTEXT" ? cleanMText(e.text) : cleanMText(e.text);
          if (!raw.trim()) return "";
          if (/[^\x00-\xFF]/.test(raw)) cjk = true;
          const h = e.textHeight || e.height || 2.5;
          const p = e.type === "MTEXT" ? e.position : (e.endPoint && (e.halign || e.valign) ? e.endPoint : e.startPoint);
          if (!p) return "";
          let rot = e.rotation || 0;
          if (e.type === "MTEXT" && e.directionVector) rot = Math.atan2(e.directionVector.y, e.directionVector.x) * 180 / Math.PI;
          const anchor = e.type === "MTEXT"
            ? ["start", "middle", "end"][((e.attachmentPoint || 1) - 1) % 3]
            : ["start", "middle", "end", "start", "middle", "start"][e.halign || 0];
          const lines = raw.split("\n");
          const topAligned = (e.type === "MTEXT" && (e.attachmentPoint || 1) <= 3) || (e.type !== "MTEXT" && e.valign === 3);
          const midV = (e.type !== "MTEXT" && (e.valign === 2 || e.halign === 4)) || (e.type === "MTEXT" && (e.attachmentPoint || 1) >= 4 && e.attachmentPoint <= 6);
          const y0 = topAligned ? h : midV ? h * 0.35 - (lines.length - 1) * h * 0.83 : -(lines.length - 1) * h * 1.66;
          const tsp = lines.map((ln, i) => `<tspan x="0" y="${y0 + i * h * 1.66}">${esc(ln)}</tspan>`).join("");
          return `<text transform="translate(${p.x} ${p.y}) rotate(${rot}) scale(1 -1)" font-size="${h}" fill="${c}" stroke="none" text-anchor="${anchor}">${tsp}</text>`;
        }
        case "INSERT": {
          const blk = dxf.blocks && dxf.blocks[e.name];
          if (!blk || !blk.entities) return "";
          const bp = blk.position || { x: 0, y: 0 };
          const sx = e.xScale || 1, sy = e.yScale || 1, r = e.rotation || 0;
          const inner = blk.entities.map(x => ent(x, col, depth + 1)).join("");
          const tf = `translate(${e.position.x} ${e.position.y}) rotate(${r}) scale(${sx} ${sy}) translate(${-bp.x} ${-bp.y})`;
          const cols = Math.max(1, e.columnCount || 1), rows = Math.max(1, e.rowCount || 1);
          if (cols === 1 && rows === 1) return `<g transform="${tf}">${inner}</g>`;
          let out = "";
          for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++)
            out += `<g transform="translate(${j * (e.columnSpacing || 0)} ${i * (e.rowSpacing || 0)})"><g transform="${tf}">${inner}</g></g>`;
          return out;
        }
        default: count--; return "";
      }
    }
    const body = (dxf.entities || []).filter(e => !e.inPaperSpace).map(e => ent(e, null, 0)).join("");
    return { content: `<g transform="scale(1 -1)">${body}</g>`, layers: [...used.entries()], hasCJK: cjk, count };
  }

  // ---------- DWG via LibreDWG (WebAssembly) ----------
  let dwgLib = null;
  async function loadDwgLib() {
    if (dwgLib) return dwgLib;
    const base = window.CAD2PDF_DWG_BASE || new URL("dwg/", document.baseURI).href;
    const mod = await import(base + "dist/libredwg-web.js");
    try { dwgLib = await mod.LibreDwg.create(base + "wasm/"); }
    catch (e) { dwgLib = await mod.LibreDwg.create(); }
    dwgLib.__types = mod.Dwg_File_Type;
    return dwgLib;
  }
  async function dwgToSvg(buf) {
    const lib = await loadDwgLib();
    const ptr = lib.dwg_read_data(buf, lib.__types.DWG);
    if (ptr == null) fail("dwgUnreadable");
    let db;
    try { db = lib.convert(ptr); } finally { try { lib.dwg_free(ptr); } catch (e) {} }
    const svgText = lib.dwg_to_svg(db);
    const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
    const root = doc.documentElement;
    if (!root || root.nodeName.toLowerCase() !== "svg") fail("convFail");
    const layers = new Map();
    for (const l of (db.tables && db.tables.LAYER && db.tables.LAYER.entries) || []) {
      if (l && l.name != null && l.color != null) layers.set(l.name, typeof l.color === "number" ? hex(l.color) : String(l.color));
    }
    let cjk = false;
    for (const t of root.querySelectorAll("text")) if (/[^\x00-\xFF]/.test(t.textContent)) { cjk = true; break; }
    return { content: root.innerHTML, layers: [...layers.entries()].slice(0, 40), hasCJK: cjk, count: (db.entities || []).length };
  }

  // ---------- sheet composition ----------
  function sheetSizePt() {
    const v = $("size").value;
    let w, h;
    if (v.endsWith("mm")) { const [a, b] = v.slice(0, -2).split("x").map(Number); w = a / 25.4 * 72; h = b / 25.4 * 72; }
    else { const [a, b] = v.split("x").map(Number); w = a * 72; h = b * 72; }
    const short = Math.min(w, h), long = Math.max(w, h);
    const o = document.querySelector('input[name="orient"]:checked').value;
    let land = true;
    if (o === "port") land = false;
    else if (o === "auto" && state.vb) land = state.vb.w >= state.vb.h;
    return land ? { w: long, h: short } : { w: short, h: long };
  }
  const hidden = document.createElementNS(NS, "svg");
  hidden.setAttribute("style", "position:absolute;left:-99999px;top:0;width:10px;height:10px;overflow:hidden");
  document.body.appendChild(hidden);
  function measure(content) {
    hidden.innerHTML = `<g id="m">${content}</g>`;
    let bb;
    try { bb = hidden.firstChild.getBBox(); } catch (e) { bb = null; }
    hidden.innerHTML = "";
    if (!bb || !isFinite(bb.width) || (bb.width === 0 && bb.height === 0)) fail("empty");
    return { x: bb.x, y: bb.y, w: Math.max(bb.width, 1e-6), h: Math.max(bb.height, 1e-6) };
  }
  function buildSheet() {
    const S = sheetSizePt(), m = 36; // 0.5 in margin
    const vb = state.vb;
    const s = Math.min((S.w - 2 * m) / vb.w, (S.h - 2 * m) / vb.h);
    const ox = (S.w - vb.w * s) / 2 - vb.x * s, oy = (S.h - vb.h * s) / 2 - vb.y * s;
    const lwPt = parseFloat($("lw").value) / 25.4 * 72;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("xmlns", NS);
    svg.setAttribute("viewBox", `0 0 ${S.w} ${S.h}`);
    svg.setAttribute("width", S.w); svg.setAttribute("height", S.h);
    svg.innerHTML = `<rect x="0" y="0" width="${S.w}" height="${S.h}" fill="#ffffff" stroke="none"/>` +
      `<g transform="translate(${ox} ${oy}) scale(${s})" stroke-width="${lwPt / s}" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif">${state.content}</g>`;
    const opts = { mono: document.querySelector('input[name="color"]:checked').value === "mono", darken: $("darken").checked };
    for (const el of svg.querySelectorAll("*")) {
      if (el.tagName === "rect" && el.parentNode === svg) continue;
      el.removeAttribute("stroke-width");
      el.removeAttribute("vector-effect");
      for (const a of ["stroke", "fill"]) {
        const v = el.getAttribute(a);
        if (!v || v === "none") continue;
        const rgb = parseColor(v);
        if (rgb) el.setAttribute(a, paperColor(rgb, opts));
      }
    }
    svg.firstElementChild.nextElementSibling.setAttribute("stroke-width", lwPt / s);
    return { svg, S };
  }
  function render() {
    if (!state.content) return;
    const { svg, S } = buildSheet();
    const box = $("sheet");
    box.innerHTML = "";
    box.style.aspectRatio = `${S.w} / ${S.h}`;
    box.style.maxWidth = `min(100%, ${Math.round(620 * S.w / S.h)}px)`;
    const view = svg.cloneNode(true);
    view.removeAttribute("width"); view.removeAttribute("height");
    box.appendChild(view);
    if (state.isSample) { const b = document.createElement("span"); b.className = "badge"; b.textContent = t("sample"); box.appendChild(b); }
    const inch = (pt) => +(pt / 72).toFixed(2);
    $("meta").innerHTML =
      `<span>${t("mFile")} <b>${esc(state.name)}</b></span>` +
      `<span>${t("mCount")} <b>${state.count}</b></span>` +
      `<span>${t("mPaper")} <b>${inch(S.w)} × ${inch(S.h)} in</b></span>` +
      `<span>${t("mText")} <b>${state.hasCJK ? t("tCJK") : t("tLatin")}</b></span>`;
    $("legend").innerHTML = state.layers.slice(0, 24).map(([n, c]) => {
      const rgb = parseColor(c);
      const pc = rgb ? paperColor(rgb, { mono: false, darken: $("darken").checked }) : c;
      return `<span><i style="background:${pc}"></i>${esc(n)}</span>`;
    }).join("");
  }
  function setStatus(k, kind, v) { const s = $("status"); lastStatus = k ? { k, kind, v } : null; s.textContent = k ? (k instanceof UserError ? k.message : t(k, v)) : ""; s.className = "status" + (kind ? " " + kind : ""); }
  function showBusy(text) {
    const box = $("sheet");
    let b = box.querySelector(".busy");
    if (!text) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement("div"); b.className = "busy"; box.appendChild(b); }
    b.textContent = text;
  }

  async function loadFile(file) {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (ext !== "dwg" && ext !== "dxf") { setStatus("onlyExt", "err"); return; }
    setStatus(""); showBusy(t(ext === "dwg" ? "readingDwg" : "readingDxf"));
    if (!state.content) { $("sheet").style.minHeight = "240px"; }
    try {
      let r;
      if (ext === "dxf") {
        const text = await file.text();
        r = dxfToSvg(text);
      } else {
        const buf = await file.arrayBuffer();
        if (!dwgLib) showBusy(t("loadingLib"));
        r = await dwgToSvg(buf);
      }
      Object.assign(state, r, { name: file.name, isSample: false });
      state.vb = measure(r.content);
      render();
      setStatus("loaded", "ok", { n: file.name });
    } catch (e) {
      console.error(e);
      showBusy("");
      setStatus(e instanceof UserError ? e : (ext === "dwg" ? "dwgFail" : "dxfFail"), "err");
    }
  }

  // ---------- PDF ----------
  async function svgToPng(svg, S, dpi) {
    const pxW = Math.round(S.w / 72 * dpi), pxH = Math.round(S.h / 72 * dpi);
    const clone = svg.cloneNode(true);
    clone.setAttribute("width", pxW); clone.setAttribute("height", pxH);
    const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const cv = document.createElement("canvas");
      cv.width = pxW; cv.height = pxH;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, pxW, pxH);
      ctx.drawImage(img, 0, 0, pxW, pxH);
      const out = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("canvas")), "image/png"));
      cv.width = cv.height = 0;
      return new Uint8Array(await out.arrayBuffer());
    } finally { URL.revokeObjectURL(url); }
  }
  async function makePdf() {
    const { jsPDF } = window.jspdf || {};
    if (!jsPDF) fail("noPdfLib");
    const { svg, S } = buildSheet();
    const pdf = new jsPDF({ orientation: S.w >= S.h ? "l" : "p", unit: "pt", format: [S.w, S.h], compress: true });
    const modeSel = $("mode").value;
    const raster = modeSel === "raster" || (modeSel === "auto" && state.hasCJK);
    if (!raster) {
      if (typeof pdf.svg !== "function") fail("noVec");
      hidden.appendChild(svg);
      try { await pdf.svg(svg, { x: 0, y: 0, width: S.w, height: S.h }); }
      finally { hidden.innerHTML = ""; }
    } else {
      const inW = S.w / 72, inH = S.h / 72;
      let dpi = Math.min(200, Math.floor(Math.sqrt(16e6 / (inW * inH))));
      let png;
      for (;;) {
        try { png = await svgToPng(svg, S, dpi); break; }
        catch (e) { if (dpi <= 72) fail("tooBig"); dpi = Math.floor(dpi * 0.75); }
      }
      pdf.addImage(png, "PNG", 0, 0, S.w, S.h, undefined, "FAST");
    }
    pdf.setProperties({ title: state.name, creator: "cad2pdf" });
    return { blob: pdf.output("blob"), raster };
  }

  const inClaude = !!(window.claude && window.claude.use);
  let downloads = null, dlReady = !inClaude;
  if (inClaude) (async () => {
    try { downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
    dlReady = true;
    if (!downloads) setStatus("noSave", "err");
  })();
  function browserDownload(blob, fname) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  $("go").addEventListener("click", async () => {
    if (!state.content) return;
    if (!dlReady) { setStatus("wait"); return; }
    if (inClaude && !downloads) { setStatus("noSave", "err"); return; }
    const btn = $("go"); btn.disabled = true;
    setStatus("making");
    try {
      const { blob, raster } = await makePdf();
      const fname = state.name.replace(/\.(dwg|dxf)$/i, "") + ".pdf";
      const info = { n: fname, s: (blob.size / 1048576).toFixed(1), m: t(raster ? "ras" : "vec") };
      if (downloads) {
        setStatus("confirm");
        await downloads.save({ filename: fname, data: blob });
        setStatus("saved", "ok", info);
      } else {
        browserDownload(blob, fname);
        setStatus("downloaded", "ok", info);
      }
    } catch (e) {
      console.error(e);
      const code = e && e.code;
      if (code === "declined") setStatus("declined", "");
      else if (code === "rate_limited") setStatus("rate", "err");
      else if (code === "too_large") setStatus("large", "err");
      else if (code) setStatus("noSave", "err");
      else setStatus(e instanceof UserError ? e : "genFail", "err");
    } finally { btn.disabled = false; }
  });

  const fileInput = $("file"), drop = $("drop");
  fileInput.addEventListener("change", () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ""; });
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });
  ["size", "lw", "darken"].forEach(id => $(id).addEventListener("change", render));
  document.querySelectorAll('input[name="orient"], input[name="color"]').forEach(r => r.addEventListener("change", render));

  // Open with the sample drawing so the sheet is visible right away.
  try {
    const r = dxfToSvg(window.SAMPLE_DXF);
    Object.assign(state, r);
    state.vb = measure(r.content);
    render();
  } catch (e) { console.error(e); setStatus("sampleFail"); }
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("cad2pdf-lang", lang); } catch (e) {}
    applyLang();
  }));
  applyLang();
})();
</script>

</body>
</html>
